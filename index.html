<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Nava Cabs · Saarthi demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Latin:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Light only, by design: no dark theme. Layout: Saarthi's dark rail on the left, a dense working canvas on the right; tables first, cards only where a thing is its own object. */
:root {
  --canvas: #fdf8f8; --surface: #ffffff; --sunken: #f8f0ef; --ink: #140707; --ink-soft: #6b5755; --ink-faint: #7d6967; --line: #f0e3e2;
  --brand: #c65851; --brand-strong: #b44c45; --brand-tint: #fbeceb; --brand-ink: #8f3a34;
  --rail: #2a1312; --rail-ink: #f6e9e8; --rail-ink-soft: #c9aeab; --rail-hover: #3a1d1b; --rail-active: #b44c45; --rail-line: #3d2321;
  --ok: #2f8f80; --ok-tint: #e4f6f3; --ok-ink: #1f6b5f; --ok-line: #b9e6de;
  --warn-tint: #fbf3e3; --warn-ink: #835b14; --warn-line: #eedcb3;
  --danger: #9c2349; --danger-tint: #fbeaf0; --danger-ink: #8a1d40; --danger-line: #f0c6d4;
  --info-tint: #e8eefa; --info-ink: #2b4c8c; --info-line: #c8d6f1;
  --violet-tint: #f1eafa; --violet-ink: #5a3a8c; --violet-line: #dccbf2;
  --accent: #140707; --accent-ink: #ffffff;
  --wa-bg: #efe7de; --wa-in: #ffffff; --wa-out: #d9fdd3; --wa-ink: #111b21;
  --shadow: 0 18px 50px rgba(42, 19, 18, .18);
  --font: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --display: 'Anek Latin', 'IBM Plex Sans', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --r-field: 8px; --r-card: 12px;
  color-scheme: light;
}
html, body { height: 100%; }
html { color-scheme: light; background: #fdf8f8; }
body { background: var(--canvas); color: var(--ink); font: 14px/1.45 var(--font); }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; letter-spacing: -.01em; }
.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); height: 100%; }

/* rail */
.rail { background: var(--rail); color: var(--rail-ink); display: flex; flex-direction: column; min-height: 0; }
.brand { display: flex; align-items: center; gap: 10px; padding: 18px 18px 14px; border-bottom: 1px solid var(--rail-line); }
.brand-mark { width: 30px; height: 30px; border-radius: 9px; background: var(--rail-active); display: grid; place-items: center; font: 700 17px var(--display); color: #fff; }
.brand b { font: 700 19px var(--display); letter-spacing: .01em; }
.brand small { display: block; color: var(--rail-ink-soft); font-size: 12px; margin-top: -2px; }
.nav { overflow-y: auto; padding: 8px 10px 16px; flex: 1; }
.nav-group { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--rail-ink-soft); padding: 14px 10px 6px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; color: var(--rail-ink); text-decoration: none; font-size: 13.5px; }
.nav a:hover { background: var(--rail-hover); }
.nav a[aria-current="page"] { background: var(--rail-active); color: #fff; }
.nav a .count { margin-left: auto; font-size: 11px; background: var(--rail-active); color: #fff; border-radius: 999px; padding: 0 7px; line-height: 18px; }
.nav a[aria-current="page"] .count { background: rgba(255,255,255,.25); }
.nav a.sub { padding-left: 32px; }
.rail-foot { padding: 12px 18px; border-top: 1px solid var(--rail-line); font-size: 12px; color: var(--rail-ink-soft); }

/* top bar + page */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.topbar { display: flex; align-items: center; gap: 12px; padding: 10px 24px; border-bottom: 1px solid var(--line); background: var(--surface); }
.topbar .menu { display: none; }
.tenant { display: flex; align-items: center; gap: 8px; font-weight: 600; min-width: 0; }
.tenant span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.demo-pill { font-size: 11.5px; font-weight: 500; color: var(--warn-ink); background: var(--warn-tint); border: 1px solid var(--warn-line); border-radius: 999px; padding: 1px 9px; white-space: nowrap; }
.topbar .spacer { flex: 1; }
.me { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-soft); white-space: nowrap; }
.avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--brand-tint); color: var(--brand-ink); font-weight: 600; font-size: 12px; flex: none; }
.page { overflow-y: auto; padding: 30px 36px 56px; flex: 1; min-height: 0; }
.crumbs { display: flex; gap: 8px; align-items: center; color: var(--ink-faint); font-size: 13px; margin-bottom: 10px; }
.head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px; margin-bottom: 24px; }
.head h1 { font-size: 30px; line-height: 1.1; }
.head p { margin: 4px 0 0; color: var(--ink-soft); }
.head .tools { display: flex; flex-wrap: wrap; gap: 8px; }

/* controls */
.btn { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-field); padding: 7px 12px; font-weight: 500; font-size: 13px; white-space: nowrap; }
.btn:hover { border-color: var(--ink-faint); }
.btn.primary { background: var(--brand-strong); border-color: var(--brand-strong); color: #fff; }
.btn.primary:hover { background: var(--brand); }
.btn.solid { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-soft); }
.btn.ghost:hover { background: var(--sunken); }
.btn.sm { padding: 4px 9px; font-size: 12.5px; }
.btn.on { background: var(--brand-tint); border-color: var(--brand); color: var(--brand-ink); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.icon-btn { border: 0; background: transparent; padding: 6px; border-radius: 8px; color: var(--ink-soft); display: inline-grid; place-items: center; }
.icon-btn:hover { background: var(--sunken); color: var(--ink); }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field label, .label { font-size: 12px; font-weight: 500; color: var(--ink-soft); }
.input, select.input, textarea.input { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-field); padding: 7px 10px; min-width: 0; }
textarea.input { resize: vertical; min-height: 120px; font-family: var(--mono); font-size: 12.5px; line-height: 1.5; }
.search { position: relative; }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--ink-faint); }
.search .input { padding-left: 34px; }
.switch { position: relative; width: 36px; height: 20px; flex: none; }
.switch input { opacity: 0; width: 100%; height: 100%; margin: 0; position: absolute; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; background: var(--line); border-radius: 999px; transition: background .15s; }
.switch span::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: transform .15s; }
.switch input:checked + span { background: var(--ok); }
.switch input:checked + span::after { transform: translateX(16px); }
.switch input:focus-visible + span { outline: 2px solid var(--brand); outline-offset: 2px; }

/* surfaces */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); }
.panel-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.panel-head h2 { font-size: 17px; }
.panel-head p { margin: 2px 0 0; color: var(--ink-soft); font-size: 13px; }
.panel-body { padding: 16px; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.filters { display: grid; grid-template-columns: minmax(0, 2.2fr) repeat(3, minmax(0, 1fr)); gap: 10px; }
.filters-2 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 10px; }
.chiprow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
.count-chip { background: var(--ok-tint); color: var(--ok-ink); border: 1px solid var(--ok-line); border-radius: 999px; padding: 4px 12px; font-weight: 600; font-size: 12.5px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 14px 16px; }
.kpi .k { font-size: 12px; color: var(--ink-soft); }
.kpi .v { font: 700 28px/1.15 var(--display); font-variant-numeric: tabular-nums; margin-top: 4px; }
.kpi .s { font-size: 12px; color: var(--ink-faint); }
.kpi.alert { border-color: var(--warn-line); background: var(--warn-tint); }
.kpi.alert .k, .kpi.alert .s { color: var(--warn-ink); }

/* tables */
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { text-align: left; font-size: 12px; font-weight: 500; color: var(--ink-faint); padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface); }
td { padding: 14px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { padding-left: 14px; padding-right: 14px; }
tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: var(--sunken); }
td.num, th.num { text-align: right; }
.sub-t { color: var(--ink-faint); font-size: 12.5px; }
.ref { font-family: var(--mono); font-size: 12px; color: var(--brand-ink); }
.trunc { max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.detail-row td { background: var(--sunken); }
.detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px 20px; padding: 4px 0; }
.detail-grid div { min-width: 0; }
.detail-grid .label { display: block; }
.empty { padding: 36px 16px; text-align: center; color: var(--ink-soft); }

/* pills */
.pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 500; border: 1px solid transparent; white-space: nowrap; }
.st-pending { background: var(--warn-tint); color: var(--warn-ink); border-color: var(--warn-line); }
.st-confirmed { background: var(--info-tint); color: var(--info-ink); border-color: var(--info-line); }
.st-assigned { background: var(--violet-tint); color: var(--violet-ink); border-color: var(--violet-line); }
.st-completed, .st-paid, .st-on_duty, .st-active, .st-approved { background: var(--ok-tint); color: var(--ok-ink); border-color: var(--ok-line); }
.st-cancelled, .st-rejected, .st-failed { background: var(--danger-tint); color: var(--danger-ink); border-color: var(--danger-line); }
.st-off_duty, .st-na { background: var(--sunken); color: var(--ink-soft); border-color: var(--line); }
.st-on_trip, .st-maintenance { background: var(--info-tint); color: var(--info-ink); border-color: var(--info-line); }
.pill.outline-warn { background: transparent; color: var(--warn-ink); border-color: var(--warn-line); }
.tag { display: inline-block; border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; font-size: 11.5px; color: var(--ink-soft); white-space: nowrap; }
.src { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--ink-faint); white-space: nowrap; }
.src.wa { color: var(--ok-ink); }
.actions { display: flex; gap: 6px; align-items: center; justify-content: flex-end; flex-wrap: nowrap; }

/* calendar */
.cal-tabs { display: inline-flex; background: var(--sunken); border-radius: 10px; padding: 3px; gap: 2px; }
.cal-tabs button { border: 0; background: transparent; border-radius: 8px; padding: 6px 12px; font-weight: 500; font-size: 13px; color: var(--ink-soft); display: inline-flex; gap: 6px; align-items: center; }
.cal-tabs button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.calgrid { display: grid; grid-template-columns: repeat(7, minmax(120px, 1fr)); gap: 8px; min-width: 900px; }
.dow { text-align: center; font-size: 12px; font-weight: 500; color: var(--ink-faint); padding: 4px 0; }
.day { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); min-height: 150px; display: flex; flex-direction: column; min-width: 0; }
.day.out { background: var(--sunken); opacity: .55; }
.day.today { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand); }
.day.drop { background: var(--brand-tint); }
.day-h { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px 4px; font-weight: 600; font-variant-numeric: tabular-nums; }
.day-h .n { font-size: 11px; font-weight: 600; background: var(--warn-tint); color: var(--warn-ink); border-radius: 999px; padding: 0 7px; }
.day-list { display: flex; flex-direction: column; gap: 5px; padding: 0 6px 6px; overflow-y: auto; max-height: 190px; }
.chip { border: 1px solid var(--line); border-left: 3px solid var(--ink-faint); border-radius: 7px; padding: 5px 7px; background: var(--surface); font-size: 12px; cursor: grab; text-align: left; width: 100%; }
.chip:hover { border-color: var(--ink-faint); }
.chip.pending { border-left-color: #d49a2a; } .chip.confirmed { border-left-color: #4b74c9; } .chip.assigned { border-left-color: #8a5cc9; } .chip.completed { border-left-color: var(--ok); } .chip.cancelled { border-left-color: var(--danger); opacity: .7; }
.chip b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip span { display: block; color: var(--ink-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip.dragging { opacity: .4; }
.drv-grid { display: grid; grid-template-columns: 170px repeat(7, minmax(110px, 1fr)); min-width: 960px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.drv-grid > div { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 6px; min-height: 64px; display: flex; flex-direction: column; gap: 5px; min-width: 0; background: var(--surface); }
.drv-grid > .hdr { min-height: 0; background: var(--sunken); font-size: 12px; font-weight: 500; color: var(--ink-soft); }
.drv-grid > .who { font-size: 13px; }
.drv-grid > .who small { color: var(--ink-faint); }
.drv-grid > .unassigned-row { background: var(--warn-tint); }

/* modal + toast */
.overlay { position: fixed; inset: 0; background: rgba(20, 7, 7, .45); display: grid; place-items: center; padding: 16px; z-index: 50; }
.modal { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); width: min(760px, 100%); max-height: calc(100% - 32px); display: flex; flex-direction: column; min-height: 0; }
.modal.narrow { width: min(560px, 100%); }
.modal-h { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; padding: 16px 18px; border-bottom: 1px solid var(--line); }
.modal-h h2 { font-size: 20px; }
.modal-h p { margin: 3px 0 0; color: var(--ink-soft); font-size: 13px; }
.modal-b { padding: 16px 18px; overflow-y: auto; min-height: 0; }
.modal-f { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); }
.callout { border-radius: 10px; padding: 10px 12px; font-size: 13px; display: flex; gap: 10px; align-items: flex-start; }
.callout.ok { background: var(--ok-tint); color: var(--ok-ink); }
.callout.warn { background: var(--warn-tint); color: var(--warn-ink); }
.callout.info { background: var(--info-tint); color: var(--info-ink); }
.drv-opt { display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; gap: 12px; align-items: center; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
.drv-opt + .drv-opt { margin-top: 8px; }
.drv-opt:has(input:checked) { border-color: var(--brand); background: var(--brand-tint); }
.drv-opt.blocked { cursor: not-allowed; opacity: .55; }
.drv-opt .why { font-size: 12px; color: var(--warn-ink); }
.drv-meta { display: flex; flex-wrap: wrap; gap: 6px 10px; font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }
.assign-cols { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 16px; }
.wa { background: var(--wa-bg); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.bubble { max-width: 92%; padding: 7px 10px 6px; border-radius: 10px; background: var(--wa-in); color: var(--wa-ink); font-size: 13px; white-space: pre-wrap; box-shadow: 0 1px 1px rgba(0,0,0,.12); }
.bubble.out { align-self: flex-end; background: var(--wa-out); }
.bubble small { display: block; text-align: right; font-size: 10.5px; opacity: .6; margin-top: 2px; }
.bubble.sys { align-self: center; background: var(--warn-tint); color: var(--warn-ink); font-size: 12px; box-shadow: none; }
.toast-wrap { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; z-index: 60; max-width: min(420px, calc(100% - 32px)); }
.toast { background: var(--accent); color: var(--accent-ink); padding: 10px 14px; border-radius: 10px; box-shadow: var(--shadow); font-size: 13px; display: flex; gap: 10px; align-items: flex-start; }
.ctx { font-family: var(--mono); font-size: 12.5px; line-height: 1.6; background: var(--sunken); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; white-space: pre-wrap; overflow-x: auto; }

/* inbox */
.inbox { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: 560px; }
.threads { border-right: 1px solid var(--line); }
.thread { display: flex; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); cursor: pointer; width: 100%; background: transparent; border-left: 0; border-right: 0; border-top: 0; text-align: left; }
.thread[aria-current="true"] { background: var(--brand-tint); }
.thread b { display: block; font-size: 13.5px; }
.thread span { display: block; font-size: 12.5px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.thread > div { min-width: 0; flex: 1; }
.chatpane { display: flex; flex-direction: column; min-width: 0; }
.chatpane .wa { flex: 1; border-radius: 0; padding: 18px; }

/* charts */
.chart svg { width: 100%; height: auto; display: block; }
.chart text { fill: var(--ink-faint); font: 11px var(--font); }
.bar-list { display: flex; flex-direction: column; gap: 10px; }
.bar-row { display: grid; grid-template-columns: 120px minmax(0, 1fr) 90px; gap: 10px; align-items: center; font-size: 13px; }
.bar-track { height: 10px; background: var(--sunken); border-radius: 999px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--brand); border-radius: 999px; }
.bar-fill.alt { background: var(--ok); }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--ink-soft); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

.nav-more { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 10px; margin-top: 12px; border: 0; border-radius: 8px; background: transparent; color: var(--rail-ink-soft); font-size: 13px; text-align: left; }
.nav-more:hover { background: var(--rail-hover); color: var(--rail-ink); }
.nav-more-list a { font-size: 13px; color: var(--rail-ink-soft); }
.nav-more-list a[aria-current="page"] { color: #fff; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
.toolbar .search { flex: 1; min-width: 200px; }
.toolbar select { width: auto; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 16px; }
.seg-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 13px; font-size: 13px; color: var(--ink-soft); }
.seg-btn:hover { border-color: var(--ink-faint); }
.seg-btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.seg-n { display: inline-block; min-width: 18px; padding: 0 6px; border-radius: 999px; background: var(--brand-strong); color: #fff; font-size: 11px; line-height: 18px; text-align: center; margin-left: 4px; }
tr.row-link { cursor: pointer; }
.panel-foot { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line); }

/* ───────────── formatting ───────────── */
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const fDate = (d) => `${MON[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
const fShort = (d) => `${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`;
const fTime = (d) => { let h = d.getHours(); const m = String(d.getMinutes()).padStart(2, '0'); const ap = h < 12 ? 'AM' : 'PM'; h = h % 12 || 12; return `${h}:${m} ${ap}`; };
const f24 = (d) => `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
const fWhen = (d) => { const diff = (NOW - d) / 60e3; if (diff < 1) return 'Just now'; if (diff < 60) return `${Math.max(1, Math.round(diff))} min ago`; if (diff < 1440 && d.getDate() === NOW.getDate()) return `Today ${fTime(d)}`; return `${fShort(d)}, ${fTime(d)}`; };
const rs = (n) => '₹' + Math.round(n).toLocaleString('en-IN');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
const dayKey = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const initials = (n) => n.split(/\s+/).map((w) => w[0]).slice(0, 2).join('').toUpperCase();
const STATUS_LABEL = { pending: 'Needs confirming', confirmed: 'Confirmed', assigned: 'Driver assigned', completed: 'Completed', cancelled: 'Cancelled' };
const pill = (st, label) => `<span class="pill st-${st}">${esc(label ?? STATUS_LABEL[st] ?? st)}</span>`;
const srcTag = (s) => s === 'whatsapp' ? `<span class="src wa">${icon('bot', 13)} WhatsApp assistant</span>` : s === 'website' ? `<span class="src">Website</span>` : `<span class="src">${icon('phone', 12)} Phone</span>`;

function startOfWeek(d) { const s = new Date(d.getFullYear(), d.getMonth(), d.getDate()); s.setDate(s.getDate() - s.getDay()); return s; }
const needsConfirm = () => BOOKINGS.filter((b) => b.status === 'pending');
const needsDriver = () => BOOKINGS.filter((b) => b.status === 'confirmed' && !b.driverId);

function renderNav() {
  const badge = { bookings: needsConfirm().length + needsDriver().length };
  const link = ([id, label, ic]) => `<a href="#${id}" data-act="go" data-id="${id}" ${state.tab === id ? 'aria-current="page"' : ''}>${icon(ic, 17)}<span>${label}</span>${badge[id] ? `<span class="count">${badge[id]}</span>` : ''}</a>`;
  const open = state.moreOpen || MORE.some(([id]) => id === state.tab);
  document.getElementById('nav').innerHTML = NAV.map(link).join('') +
    `<button class="nav-more" data-act="morenav" aria-expanded="${open}">${icon(open ? 'up' : 'down', 15)}<span>${open ? 'Fewer' : 'More'}</span></button>` +
    (open ? `<div class="nav-more-list">${MORE.map(link).join('')}</div>` : '');
}
function go(tab) {
  state.tab = TITLES[tab] ? tab : 'overview';
  try { history.replaceState(null, '', '#' + state.tab); } catch (e) {}
  document.getElementById('app').classList.remove('nav-open');
  render();
  document.getElementById('page').scrollTop = 0;
}
function render() {
  renderNav();
  const page = document.getElementById('page');

}
function header(title, sub, tools = '') {

/* ───────────── shared cells ───────────── */
const titleCase = (t) => t.toLowerCase().replace(/\b\w/g, (c) => c.toUpperCase());
function tripLabel(b) {
  if (b.service === 'airport') return b.direction === 'to_airport' ? 'Airport drop' : 'Airport pickup';
  if (b.service === 'outstation') return `Outstation, ${b.days} day${b.days > 1 ? 's' : ''}`;
  if (b.service === 'local') return `Local, ${b.hours} hrs`;
  return 'City ride';
}
const whenCell = (b) => `<b style="font-weight:600">${fShort(b.travel)}</b><div class="sub-t">${fTime(b.travel)}</div>`;
const carCell = (b) => `<span style="font-weight:500">${titleCase(b.vehicleType)}</span><div class="sub-t">${tripLabel(b)}</div>`;
function driverCell(b) {
  if (b.status === 'cancelled' || b.status === 'pending') return '<span class="sub-t">—</span>';
  if (!b.driverId) return '<span class="pill outline-warn">Not assigned</span>';
  return esc(driverById(b.driverId).name);
}
function actionCell(b) {
  if (b.status === 'pending') return `<button class="btn sm solid" data-act="confirm" data-id="${b.ref}">Confirm</button>`;
  if (b.status === 'confirmed' && !b.driverId) return `<button class="btn sm primary" data-act="assign" data-id="${b.ref}">Assign driver</button>`;
  return '';
}

/* Bookings */
function filtered() {
  const f = state.f, q = f.q.trim().toLowerCase();
  let from = null, to = null;
  if (f.when !== 'any') {
    const s = new Date(NOW.getFullYear(), NOW.getMonth(), NOW.getDate());
    if (f.when === 'week') { from = dayKey(startOfWeek(NOW)); const e = startOfWeek(NOW); e.setDate(e.getDate() + 6); to = dayKey(e); }
    else { if (f.when === 'tomorrow') s.setDate(s.getDate() + 1); from = to = dayKey(s); }
  }
  const soonest = ['pending', 'needs_driver', 'upcoming'].includes(f.status);
  return BOOKINGS.filter((b) => {
    const c = custById(b.customerId);
    if (q && !(b.ref.toLowerCase().includes(q) || c.name.toLowerCase().includes(q) || c.phone.replace(/\s/g, '').includes(q.replace(/\s/g, '')))) return false;
    if (f.status === 'needs_driver') { if (!(b.status === 'confirmed' && !b.driverId)) return false; }
    else if (f.status === 'upcoming') { if (!((b.status === 'confirmed' || b.status === 'assigned') && b.travel >= NOW)) return false; }
    else if (f.status !== 'all' && b.status !== f.status) return false;
    const k = dayKey(b.travel);
    return (!from || k >= from) && (!to || k <= to);
  }).sort((a, b) => soonest ? a.travel - b.travel : b.travel - a.travel);
}
const STATUS_TABS = [['all', 'All'], ['pending', 'Needs confirming'], ['needs_driver', 'Needs a driver'], ['upcoming', 'Upcoming'], ['completed', 'Completed'], ['cancelled', 'Cancelled']];

  <div class="toolbar">
    <div class="search">${icon('search', 16)}<input class="input" id="f-q" data-f="q" placeholder="Search name, mobile or booking number" value="${esc(f.q)}" aria-label="Search bookings"></div>
    <select class="input" id="f-when" data-f="when" aria-label="Travel date">${[['any', 'Any date'], ['today', 'Today'], ['tomorrow', 'Tomorrow'], ['week', 'This week']].map(([v, l]) => `<option value="${v}" ${f.when === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
  </div>

    <span class="sub-t" id="bk-count" style="margin-left:auto"></span></div>
  <section class="panel" id="bk-results"></section>`;
};

    ${rows.length > shown.length ? `<div style="padding:12px;text-align:center"><button class="btn" data-act="more">Show more</button></div>` : ''}`;
}
function detailGrid(b) {

  return `<div class="detail-grid">

    <div><span class="label">Rider</span>${esc(c.name)} · ${c.phone}</div>

  </section>`;
};
function chip(b, withDriver = true) {
  const c = custById(b.customerId), d = b.driverId && driverById(b.driverId);
  const second = withDriver ? (d ? d.name : b.status === 'pending' ? 'To confirm' : b.status === 'cancelled' ? 'Cancelled' : 'No driver yet') : titleCase(b.vehicleType);
  return `<button class="chip ${b.status}" draggable="${b.status !== 'completed' && b.status !== 'cancelled'}" data-drag="${b.ref}" data-act="view" data-id="${b.ref}">
    <b>${f24(b.travel)} ${esc(c.name.split(' ')[0])}</b><span>${esc(second)}</span></button>`;
}
function dayCell(date, outside) {
  const list = BOOKINGS.filter((b) => sameDay(b.travel, date)).sort((a, b) => a.travel - b.travel);
  return `<div class="day ${outside ? 'out' : ''} ${sameDay(date, NOW) ? 'today' : ''}" data-dropday="${dayKey(date)}">
    <div class="day-h"><span>${date.getDate()}</span>${list.length ? `<span class="n">${list.length}</span>` : ''}</div>
    <div class="day-list">${list.map((b) => chip(b)).join('')}</div></div>`;
}
function monthGrid() {
  const m = state.cal.cursor, first = new Date(m.getFullYear(), m.getMonth(), 1), start = startOfWeek(first);
  const cells = []; const d = new Date(start);
  do { for (let i = 0; i < 7; i++) { cells.push(dayCell(new Date(d), d.getMonth() !== m.getMonth())); d.setDate(d.getDate() + 1); } } while (d.getMonth() === m.getMonth());
  return `<div class="calgrid">${DOW.map((x) => `<div class="dow">${x}</div>`).join('')}${cells.join('')}</div>`;
}
function weekDays() { return Array.from({ length: 7 }, (_, i) => { const d = new Date(state.cal.weekStart); d.setDate(d.getDate() + i); return d; }); }
function weekGrid() {
  return `<div class="calgrid">${weekDays().map((d) => `<div class="dow">${DOW[d.getDay()]} ${d.getDate()}</div>`).join('')}${weekDays().map((d) => dayCell(d, false).replace('min-height: 150px', '')).join('')}</div>`;
}
function driversGrid() {
  const days = weekDays();
  const cell = (d, driverId, cls = '') => {
    const list = BOOKINGS.filter((b) => sameDay(b.travel, d) && (driverId ? b.driverId === driverId : (b.status === 'confirmed' || b.status === 'pending') && !b.driverId)).sort((a, b) => a.travel - b.travel);
    return `<div class="${cls}" data-dropday="${dayKey(d)}" ${driverId ? `data-dropdriver="${driverId}"` : ''}>${list.map((b) => chip(b, false)).join('')}</div>`;
  };
  return `<div class="drv-grid"><div class="hdr">Driver</div>${days.map((d) => `<div class="hdr">${DOW[d.getDay()]} ${d.getDate()}${sameDay(d, NOW) ? ' · today' : ''}</div>`).join('')}
    <div class="who unassigned-row"><b>No driver yet</b><small>Drag onto a driver</small></div>${days.map((d) => cell(d, null, 'unassigned-row')).join('')}
    ${DRIVERS.map((dr) => { const v = vehicleOf(dr); return `<div class="who"><b>${esc(dr.name)}</b><small>${v.type} · ${dr.duty === 'on_duty' ? 'on duty' : 'off duty'}</small></div>${days.map((d) => cell(d, dr.id)).join('')}`; }).join('')}</div>`;
}
AFTER.calendar = () => {
  const page = document.getElementById('page');
  page.querySelectorAll('[data-drag]').forEach((el) => {
    el.addEventListener('dragstart', (e) => { e.dataTransfer.setData('text/plain', el.dataset.drag); el.classList.add('dragging'); });
    el.addEventListener('dragend', () => el.classList.remove('dragging'));
  });
  page.querySelectorAll('[data-dropday]').forEach((el) => {
    el.addEventListener('dragover', (e) => { e.preventDefault(); el.classList.add('drop'); });
    el.addEventListener('dragleave', () => el.classList.remove('drop'));
    el.addEventListener('drop', (e) => {
      e.preventDefault(); el.classList.remove('drop');
      const b = bookingByRef(e.dataTransfer.getData('text/plain')); if (!b) return;
      const [y, mo, da] = el.dataset.dropday.split('-').map(Number);
      const moved = new Date(y, mo - 1, da, b.travel.getHours(), b.travel.getMinutes());
      const driverId = el.dataset.dropdriver;
      if (driverId) {
        if (b.status === 'pending') return toast(`${b.ref} needs confirming before it gets a driver.`);
        const old = b.travel; b.travel = moved;
        const d = driverById(driverId), clash = conflictFor(d, b);
        if (clash || d.duty !== 'on_duty') { b.travel = old; return toast(clash ? `${d.name} already has ${clash.ref} at ${f24(clash.travel)}.` : `${d.name} is off duty.`); }
        doAssign(b, d);
      } else if (!sameDay(moved, b.travel)) {
        b.travel = moved; log('Moved booking to ' + fShort(moved), b.ref);
        if (b.driverId && conflictFor(driverById(b.driverId), b)) { b.driverId = null; if (b.status === 'assigned') b.status = 'confirmed'; toast(`${b.ref} moved to ${fShort(moved)}. Its driver is busy then, so pick a new one.`); }
        else toast(`${b.ref} moved to ${fShort(moved)}.`);
        render();
      }
    });
  });
};

/* Driver performance */
function perf(d) {
  const mine = BOOKINGS.filter((b) => b.driverId === d.id && b.travel.getMonth() === 9);
  const done = mine.filter((b) => b.status === 'completed');
  const h = (parseInt(d.id.slice(1)) * 37) % 11;
  return { trips: done.length, earned: done.reduce((s, b) => s + b.price, 0), onTime: 88 + (h % 12), accept: 90 + (h % 10), cancels: h % 3 };
}
VIEWS.performance = () => {
  const rows = DRIVERS.map((d) => ({ d, ...perf(d) })).sort((a, b) => b.trips - a.trips);
  const max = Math.max(...rows.map((r) => r.trips), 1);
  return header('Driver Performance', 'October so far, from completed trips.') + `

/* Charts */
function barChart(values, labels, { h = 220, mark = -1, color = 'var(--brand)' } = {}) {
  const W = 720, top = 16, bottom = 28, left = 30, right = 8, ih = h - top - bottom, iw = W - left - right;
  const max = Math.max(...values, 1), step = Math.ceil(max / 4), ymax = step * 4, bw = iw / values.length;
  const grid = [0, 1, 2, 3, 4].map((i) => { const y = top + ih - (ih * i * step) / ymax; return `<line x1="${left}" x2="${W - right}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${left - 6}" y="${y + 4}" text-anchor="end">${i * step}</text>`; }).join('');
  const bars = values.map((v, i) => { const bh = (ih * v) / ymax, x = left + i * bw + bw * 0.18, y = top + ih - bh; return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw * 0.64).toFixed(1)}" height="${bh.toFixed(1)}" rx="3" fill="${i === mark ? 'var(--ink)' : color}"><title>${labels[i]}: ${v}</title></rect>`; }).join('');
  const every = Math.ceil(values.length / 12);
  const xl = labels.map((l, i) => i % every === 0 ? `<text x="${(left + i * bw + bw / 2).toFixed(1)}" y="${h - 8}" text-anchor="middle">${l}</text>` : '').join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${h}" role="img" aria-label="Bar chart">${grid}${bars}${xl}</svg></div>`;
}
function barList(rows, alt) { const max = Math.max(...rows.map((r) => r[1]), 1); return `<div class="bar-list">${rows.map(([l, v, shown]) => `<div class="bar-row"><span>${l}</span><div class="bar-track"><div class="bar-fill ${alt ? 'alt' : ''}" style="width:${(100 * v / max).toFixed(1)}%"></div></div><b style="text-align:right">${shown ?? v}</b></div>`).join('')}</div>`; }

function botContext() {
  if (!SETTINGS.botSeesDrivers) return 'The drivers list is not shared.\nThe assistant tells riders "our team will confirm your driver" and never names one.';
  const vis = DRIVERS.filter((d) => d.botVisible);
  const free = {}; vis.forEach((d) => { const v = vehicleOf(d); if (d.duty === 'on_duty' && v.status === 'active') free[v.type] = (free[v.type] || 0) + 1; });
  return `On duty: ${vis.filter((d) => d.duty === 'on_duty').length} of ${vis.length} drivers\nFree now: ${Object.entries(free).map(([t, n]) => `${n} ${titleCase(t)}`).join(', ')}\n\n`
    + `It can say whether a car type is free.\nIt names a driver only after you assign one.\n${SETTINGS.sharePhone ? "It sends the driver's phone number with their details." : "It never shares a driver's phone number."}`;
}

    <td class="num"><label class="switch"><input type="checkbox" id="vis-${d.id}" data-act="vis" data-id="${d.id}" ${d.botVisible ? 'checked' : ''} ${SETTINGS.botSeesDrivers ? '' : 'disabled'} aria-label="Assistant can see ${esc(d.name)}"><span></span></label></td></tr>`; }).join('')}

      <button class="btn sm" data-act="toggleadd">${icon(state.addOpen ? 'x' : 'plus', 14)}${state.addOpen ? 'Close' : 'Add a driver'}</button>
    </div>

        <div class="field"><span class="label">&nbsp;</span><button class="btn solid" type="submit">Add driver</button></div>
      </div></form>` : ''}
  </section>
  <div class="grid2">
    <section class="panel"><div class="panel-head"><div><h2>Message the rider gets</h2><p>Sent on WhatsApp when you assign a driver.</p></div></div>

    <section class="panel"><div class="panel-head"><div><h2>What the assistant knows</h2><p>Changes as you flip the switches. Riders never see this.</p></div></div><div class="panel-body"><div class="ctx" id="bot-ctx">${esc(botContext())}</div></div></section>

AFTER.settings = () => {
  document.getElementById('add-driver')?.addEventListener('submit', (e) => {
    e.preventDefault();
    const name = document.getElementById('nd-name').value.trim(), phone = document.getElementById('nd-phone').value.trim(), vehicleId = document.getElementById('nd-car').value;
    if (!name || !phone) return;
    const id = 'd' + (DRIVERS.length + 1);
    DRIVERS.push({ id, name, phone, vehicleId, rating: 5, duty: 'on_duty', botVisible: true, sharePhone: true });
    PAYOUTS[id] = { paid: 0, last: new Date(NOW) };

};
const sampleAssigned = () => BOOKINGS.find((b) => b.status === 'assigned' && b.travel >= NOW) || BOOKINGS.find((b) => b.driverId);
function fillTemplate(b, d) {
  const v = vehicleOf(d);
  return SETTINGS.template.replace(/\{driver_name\}/g, d.name).replace(/\{driver_phone_line\}/g, SETTINGS.sharePhone ? ` (${d.phone})` : '').replace(/\{driver_phone\}/g, SETTINGS.sharePhone ? d.phone : '')
    .replace(/\{vehicle\}/g, v.model).replace(/\{plate\}/g, v.plate).replace(/\{pickup_time\}/g, `${fShort(b.travel)}, ${fTime(b.travel)}`).replace(/\{pickup\}/g, b.pickup).replace(/\{ref\}/g, b.ref);
}
function previewBubble(b, d) { return b && d ? `<div class="bubble out">${esc(fillTemplate(b, d))}<small>now</small></div>` : '<div class="bubble sys">Pick a driver to see the message.</div>'; }

/* ───────────── modals ───────────── */
const overlay = document.getElementById('overlay');
function openModal(html, narrow) { overlay.innerHTML = `<div class="modal ${narrow ? 'narrow' : ''}" role="dialog" aria-modal="true">${html}</div>`; overlay.hidden = false; if (!matchMedia('(pointer: coarse)').matches) overlay.querySelector('button.primary, button.solid, input, select')?.focus(); }
function closeModal() { overlay.hidden = true; overlay.innerHTML = ''; }
const mHead = (t, s) => `<div class="modal-h"><div><h2>${t}</h2>${s ? `<p>${s}</p>` : ''}</div><button class="icon-btn" data-act="close" aria-label="Close">${icon('x', 18)}</button></div>`;

function viewModal(ref) {
  const b = bookingByRef(ref), c = custById(b.customerId);
  openModal(mHead(`${esc(c.name)} · ${SERVICE_LABEL[b.service]}`, `<span class="ref">${b.ref}</span> · ${fShort(b.travel)}, ${fTime(b.travel)}`) + `
    <div class="modal-b stack">
      <div style="display:flex;gap:8px;flex-wrap:wrap">${pill(b.status)} ${b.payment === 'na' ? pill('na', 'Refunded') : pill(b.payment, b.payment === 'paid' ? 'Paid' : 'Payment pending')} ${srcTag(b.source)}</div>
      <div class="detail-grid"><div><span class="label">Pickup</span>${esc(b.pickup)}</div><div><span class="label">Drop</span>${esc(b.drop)}</div><div><span class="label">Car</span>${b.vehicleType}</div><div><span class="label">Price</span><b>${rs(b.price)}</b></div><div><span class="label">Driver</span>${driverCell(b)}</div><div><span class="label">Booking number</span><span class="ref">${b.ref}</span></div></div>
      ${detailGrid(b)}
    </div>
    <div class="modal-f">${b.status === 'pending' || b.status === 'confirmed' ? `<button class="btn" data-act="cancel" data-id="${b.ref}">Cancel booking</button>` : ''}
      ${b.status === 'pending' ? `<button class="btn solid" data-act="confirm" data-id="${b.ref}">${icon('check', 15)}Confirm booking</button>` : ''}
      ${b.status === 'confirmed' && !b.driverId ? `<button class="btn primary" data-act="assign" data-id="${b.ref}">Assign driver</button>` : ''}
      ${b.status === 'assigned' ? `<button class="btn" data-act="assign" data-id="${b.ref}">Change driver</button><button class="btn solid" data-act="complete" data-id="${b.ref}">Mark trip completed</button>` : ''}
      ${b.status === 'completed' || b.status === 'cancelled' ? '<button class="btn" data-act="close">Close</button>' : ''}</div>`);
}

function eligibility(b, d) {
  const v = vehicleOf(d);
  if (v.status !== 'active') return { ok: false, why: `${v.model} is in for service` };
  if (d.duty !== 'on_duty') return { ok: false, why: 'Off duty' };
  const clash = conflictFor(d, b);
  if (clash) return { ok: false, why: `Busy: ${clash.ref} at ${f24(clash.travel)}${sameDay(clash.travel, b.travel) ? '' : ' on ' + fShort(clash.travel)}` };
  if (v.type !== b.vehicleType) return { ok: true, mismatch: true, why: `Drives a ${v.type.toLowerCase()}, rider booked a ${b.vehicleType.toLowerCase()}` };
  return { ok: true };
}
function assignModal(ref, justConfirmed) {
  const b = bookingByRef(ref), c = custById(b.customerId);
  const noExactFit = !DRIVERS.some((d) => { const e = eligibility(b, d); return e.ok && !e.mismatch; });
  let showAll = noExactFit, chosen = b.driverId || null;
  const draw = () => {
    const list = DRIVERS.map((d) => ({ d, e: eligibility(b, d), today: tripsToday(d) }))
      .filter((x) => showAll || !x.e.mismatch)
      .sort((a, z) => (z.e.ok - a.e.ok) || ((a.e.mismatch ? 1 : 0) - (z.e.mismatch ? 1 : 0)) || (a.today - z.today));
    const best = list.find((x) => x.e.ok && !x.e.mismatch);
    const sel = chosen && driverById(chosen);
    openModal(mHead(justConfirmed ? 'Booking confirmed. Now pick a driver' : 'Assign a driver', `<span class="ref">${b.ref}</span> · ${fShort(b.travel)}, ${fTime(b.travel)} · ${esc(c.name)} · ${b.vehicleType}`) + `
      <div class="modal-b">
        ${noExactFit ? `<div class="callout warn" style="margin-bottom:14px">${icon('clock', 16)}<div>No ${b.vehicleType.toLowerCase()} driver is free then. These drivers have a different car, so tell the rider if you send one.</div></div>` : ''}
        ${justConfirmed ? `<div class="callout ok" style="margin-bottom:14px">${icon('check', 16)}<div>${esc(c.name)} has been told the ride is confirmed. Once you assign a driver, they get the driver's details on WhatsApp.</div></div>` : ''}
        <div class="assign-cols">
          <div><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap"><span class="label">Drivers, best fit first</span>
            <label class="sub-t" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="show-all" data-act="showall" ${showAll ? 'checked' : ''}>Show other car types</label></div>
            ${list.map(({ d, e, today }) => { const v = vehicleOf(d); return `<label class="drv-opt ${e.ok ? '' : 'blocked'}">
              <input type="radio" name="drv" value="${d.id}" ${e.ok ? '' : 'disabled'} ${chosen === d.id ? 'checked' : ''} data-act="pickdrv" data-id="${d.id}">
              <div class="avatar">${initials(d.name)}</div>
              <div style="min-width:0"><b>${esc(d.name)}</b>${best && best.d === d ? ' <span class="pill st-completed" style="margin-left:4px">Best fit</span>' : ''}
                <div class="drv-meta"><span>${esc(v.model)} · ${v.plate}</span><span>${today} trip${today === 1 ? '' : 's'} today</span><span>★ ${d.rating.toFixed(1)}</span></div>
                ${e.why ? `<div class="why">${esc(e.why)}</div>` : ''}</div>
              <span class="tag">${v.type}</span></label>`; }).join('')}
          </div>
          <div><span class="label">WhatsApp message to ${esc(c.name.split(' ')[0])}</span><div class="wa" style="margin-top:8px">${sel ? previewBubble(b, sel) : '<div class="bubble sys">Pick a driver to see the message.</div>'}</div>
            <p class="sub-t">Edit this message in Settings, under Cab bot.</p></div>
        </div>
      </div>
      <div class="modal-f"><button class="btn" data-act="close">${justConfirmed ? 'Assign later' : 'Cancel'}</button>
        <button class="btn primary" id="do-assign" ${sel ? '' : 'disabled'}>${icon('check', 15)}${b.driverId && b.driverId !== chosen ? 'Change driver and tell the rider' : 'Assign and tell the rider'}</button></div>`);
    overlay.querySelector('#show-all').addEventListener('change', (e) => { showAll = e.target.checked; draw(); });
    overlay.querySelectorAll('input[name="drv"]').forEach((r) => r.addEventListener('change', () => { chosen = r.value; draw(); }));
    overlay.querySelector('#do-assign').addEventListener('click', () => { if (chosen) { doAssign(b, driverById(chosen)); closeModal(); } });
  };
  draw();
}
function doAssign(b, d) {
  const prev = b.driverId && b.driverId !== d.id ? driverById(b.driverId) : null;
  b.driverId = d.id; b.status = 'assigned';
  log(prev ? `Changed driver from ${prev.name} to ${d.name}` : `Assigned ${d.name}`, b.ref, 'Owner');
  log('Sent driver details to the rider', b.ref, 'Saarthi assistant');
  toast(`${d.name} assigned to ${b.ref}. ${custById(b.customerId).name} got the driver's details on WhatsApp.`);
  render();
}
function newBookingModal() {
  const today = dayKey(new Date(NOW.getTime() + 864e5));
  openModal(mHead('New booking', 'For a rider who called or walked in. WhatsApp bookings arrive here by themselves.') + `

      <div class="field"><label for="nb-car">Car</label><select class="input" id="nb-car">${TYPES.map((t) => `<option ${t === 'SWIFT DZIRE' ? 'selected' : ''}>${t}</option>`).join('')}</select></div>

    const svc = g('nb-svc'), car = g('nb-car');
    const b = { ref: 'SC2026' + (3240 + BOOKINGS.length), service: svc, vehicleType: car, travel: new Date(y, m - 1, d, hh, mm), customerId: c.id, passengers: 1, source: 'phone', pickup: g('nb-pick'), drop: g('nb-drop'), created: new Date(NOW), status: 'pending', payment: 'pending', driverId: null, notes: '' };
    if (svc === 'airport') { b.direction = /airport/i.test(b.drop) ? 'to_airport' : 'from_airport'; b.price = FARE.airport[car]; }
    else if (svc === 'outstation') { b.days = 1; b.price = FARE.perKm[car] * 300; OUT_CITIES[b.drop] = OUT_CITIES[b.drop] || 125; }
    else { b.hours = 4; b.price = FARE.local[4]; }
    const confirmNow = document.getElementById('nb-confirm').checked;
    BOOKINGS.push(b); log('Created booking by phone', b.ref, 'Owner');
    closeModal();
    if (confirmNow) { confirmBooking(b.ref); } else { toast(`${b.ref} created. It needs confirming.`); render(); }
  });
}
function confirmBooking(ref) {
  const b = bookingByRef(ref); b.status = 'confirmed';
  log('Confirmed booking', b.ref, 'Owner'); log('Told the rider the ride is confirmed', b.ref, 'Saarthi assistant');
  render(); assignModal(ref, true);
}

/* ───────────── toast + log ───────────── */
function toast(msg) {
  const el = document.createElement('div'); el.className = 'toast'; el.innerHTML = `${icon('check', 16)}<span>${esc(msg)}</span>`;
  document.getElementById('toasts').appendChild(el); setTimeout(() => el.remove(), 4800);
}
let liveSeq = 0;
function log(what, ref, who = 'Owner') { AUDIT.push({ at: new Date(NOW.getTime() + 1000 * ++liveSeq), who, what, ref }); }

/* ───────────── events ───────────── */
const ACT = {
  go: (id, el, e) => { e.preventDefault(); go(id); },
  menu: () => document.getElementById('app').classList.toggle('nav-open'),
  expand: (ref) => { state.expanded.has(ref) ? state.expanded.delete(ref) : state.expanded.add(ref); renderResults(); },
  more: () => { state.f.limit += 25; renderResults(); },
  sort: (dir) => { state.f.sort = dir; render(); },
  quick: (k) => { const f = state.f; const t = new Date(NOW); if (k === 'clear') { f.tFrom = f.tTo = f.bFrom = f.bTo = ''; } else if (k === 'today') { f.tFrom = f.tTo = dayKey(t); } else if (k === 'tomorrow') { t.setDate(t.getDate() + 1); f.tFrom = f.tTo = dayKey(t); } else { const s = startOfWeek(t), e2 = new Date(s); e2.setDate(e2.getDate() + 6); f.tFrom = dayKey(s); f.tTo = dayKey(e2); } f.limit = 25; render(); },
  view: (ref, el, e) => { e.stopPropagation(); viewModal(ref); },
  chat: (cid) => { state.thread = CHATS[cid] ? cid : 'c1'; if (!CHATS[cid]) toast('This demo has three sample chats. Showing Divya Rao.'); go('inbox'); },
  thread: (cid) => { state.thread = cid; render(); },
  confirm: (ref) => { closeModal(); confirmBooking(ref); },
  assign: (ref) => { closeModal(); assignModal(ref, false); },
  complete: (ref) => { const b = bookingByRef(ref); b.status = 'completed'; log('Marked trip completed', ref); closeModal(); toast(`${ref} marked completed.`); render(); },
  cancel: (ref) => { const b = bookingByRef(ref); b.status = 'cancelled'; b.driverId = null; b.payment = 'na'; log('Cancelled booking', ref); log('Told the rider the booking is cancelled', ref, 'Saarthi assistant'); closeModal(); toast(`${ref} cancelled. The rider was told on WhatsApp.`); render(); },
  close: () => closeModal(),
  morenav: () => { state.moreOpen = !state.moreOpen; renderNav(); },
  fstatus: (v) => { state.f.status = v; state.f.limit = 25; render(); },
  toggleadd: () => { state.addOpen = !state.addOpen; render(); },
  new: () => newBookingModal(),
  calview: (v) => { state.cal.view = v; render(); },
  calprev: () => { const c = state.cal; if (c.view === 'month') c.cursor = new Date(c.cursor.getFullYear(), c.cursor.getMonth() - 1, 1); else c.weekStart = new Date(c.weekStart.getFullYear(), c.weekStart.getMonth(), c.weekStart.getDate() - 7); render(); },
  calnext: () => { const c = state.cal; if (c.view === 'month') c.cursor = new Date(c.cursor.getFullYear(), c.cursor.getMonth() + 1, 1); else c.weekStart = new Date(c.weekStart.getFullYear(), c.weekStart.getMonth(), c.weekStart.getDate() + 7); render(); },
  caltoday: () => { state.cal.cursor = new Date(2026, 9, 1); state.cal.weekStart = startOfWeek(NOW); render(); },
  paid: (ref) => { bookingByRef(ref).payment = 'paid'; log('Marked payment received', ref); toast(`${ref} marked paid.`); render(); },
  paylink: (ref) => { log('Sent a payment link on WhatsApp', ref, 'Saarthi assistant'); toast(`Payment link for ${ref} sent to ${custById(bookingByRef(ref).customerId).name} on WhatsApp.`); },
  payout: (id) => { const d = driverById(id); const amt = walletBal(d); PAYOUTS[id].paid += amt; PAYOUTS[id].last = new Date(NOW); log(`Paid out ${rs(amt)} to ${d.name}`, '—'); toast(`${rs(amt)} paid out to ${d.name}.`); render(); },
  fund: (key) => { const [id, st] = key.split(':'); const f = FUND_REQUESTS.find((x) => x.id === id); f.status = st; log(`${st === 'approved' ? 'Approved' : 'Declined'} ${rs(f.amount)} for ${driverById(f.driverId).name}`, '—'); toast(`${st === 'approved' ? 'Approved' : 'Declined'}. ${driverById(f.driverId).name} has been told.`); render(); },
  export: () => toast('In Saarthi this downloads a spreadsheet. Downloads are switched off in this demo.'),
  loyaltyblast: () => toast('Saarthi would draft a points reminder for you to approve before it goes to riders who opted in.'),
};
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el) { if (e.target === overlay) closeModal(); return; }
  if (el.tagName === 'INPUT') return; // switches and radios use change
  ACT[el.dataset.act]?.(el.dataset.id, el, e);
});
document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.dataset.f) { state.f[el.dataset.f] = el.value; state.f.limit = 25; renderResults(); return; }
  if (el.dataset.x) { state.exp[el.dataset.x] = el.value; render(); return; }
  const id = el.dataset.id;
  if (el.dataset.act === 'duty') { const d = driverById(id); d.duty = el.checked ? 'on_duty' : 'off_duty'; log(`${d.name} set ${el.checked ? 'on' : 'off'} duty`, '—'); render(); }
  if (el.dataset.act === 'botsees') { SETTINGS.botSeesDrivers = el.checked; render(); }
  if (el.dataset.act === 'vis') { driverById(id).botVisible = el.checked; render(); }
  if (el.dataset.act === 'sharephone') { SETTINGS.sharePhone = el.checked; render(); }
});
document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.dataset.f === 'q') { state.f.q = el.value; state.f.limit = 25; renderResults(); }
  if (el.dataset.act === 'tpl') { SETTINGS.template = el.value; const b = sampleAssigned(); document.getElementById('tpl-preview').innerHTML = previewBubble(b, driverById(b.driverId)); }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !overlay.hidden) closeModal();
  if (e.key === 'Enter' && e.target.matches?.('tr.row-link')) e.target.click();
});

/* ───────────── boot ───────────── */
document.querySelector('[data-act="menu"]').innerHTML = icon('menu', 20);
// Light only: drop any theme a viewer or an older version of this page set.
delete document.documentElement.dataset.theme;
try { localStorage.removeItem('cabdesk-theme'); } catch (e) {}
go((location.hash || '').slice(1) || 'overview');
